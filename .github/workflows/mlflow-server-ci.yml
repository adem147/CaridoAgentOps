name: MLflow Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f services/mlflow-server/requirements.txt ]; then pip install -r services/mlflow-server/requirements.txt; fi

    - name: Smoke Test
      run: |
        echo "Testing MLflow Server Startup..."
        timeout 5s python services/mlflow-server/main.py || [ $? -eq 124 ]
