name: API Gateway CI

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install dependencies for API Gateway
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f api-gateway/requirements.txt ]; then pip install -r api-gateway/requirements.txt; fi

    # 4. Smoke Test: Verify the app starts
    # We use 'timeout' to stop the app after 5 seconds, because a server runs forever.
    # If it crashes before 5 seconds, the command fails and the CI fails.
    - name: Smoke Test
      run: |
        timeout 5s python api-gateway/main.py || [ $? -eq 124 ]
